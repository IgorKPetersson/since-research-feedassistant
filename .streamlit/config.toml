# T-045: one accent colour, applied via Streamlit's own supported theming mechanism
# (not CSS fighting its internals) so it's picked up natively by the primary button
# (Ask) and st.progress() (the context-budget bar) in both light and dark theme.
# vg09/ui_helpers.py's CUSTOM_CSS uses the same hex for citation chips, by explicit
# my decision (T-045) - kept as one source of truth here in the comment on both
# sides, since Streamlit's theme config and a CSS string can't literally share a
# Python constant.
#
# #A26B16 - a warm amber. Chosen deliberately over Streamlit's default red and over
# an indigo/violet (the other common "distinct from stock" choice, but overused
# enough in modern SaaS UIs to risk reading as generic too) - see docs/TICKETS.md T-045
# for the full reasoning. Darkened from T-045's #C17F1A by T-050 so the Ask button's
# white label reaches WCAG AA (4.52:1, was 3.32:1).
#
# Set under [theme.light] and [theme.dark] separately, not a single top-level
# [theme] - found live (T-045's own real verification): a bare [theme] section with
# any color set makes Streamlit treat the app as having one fully custom, fixed
# theme, and it removes the viewer's Light/Dark toggle entirely, ignoring the OS's
# own prefers-color-scheme too (checked directly - emulating a dark OS preference
# still rendered light, with no toggle to switch it back). Defining both variants
# explicitly, even with only primaryColor set in each, keeps the toggle (two real
# themes for it to switch between) and lets Streamlit fill in its own sensible
# per-mode defaults for everything else.
#
# T-060: Since.bat starts the app with a double-click, so nobody is at the console to
# answer Streamlit's first-run "enter your email" prompt - it would wait there forever.
#
# T-071 (D-020): listen on this machine only. Without it Streamlit binds every
# interface (0.0.0.0 and [::], measured 2026-10-05), so the app, including the Sources
# page that starts fetches and writes files, was reachable from the local network and
# over this machine's global IPv6 addresses wherever the firewall let it through.
# XSRF protection is left at its default (on).
[server]
showEmailPrompt = false
address = "127.0.0.1"

# T-074 (D-020): Streamlit sends usage statistics from the browser by default
# (gatherUsageStats = true, checked with `streamlit config show` 2026-10-05). Nothing
# leaves this machine that the app does not need, so it is off.
[browser]
gatherUsageStats = false

[theme.light]
primaryColor = "#A26B16"

[theme.dark]
primaryColor = "#A26B16"
